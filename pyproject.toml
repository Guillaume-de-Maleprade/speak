[project]
name = "speak-mcp"
version = "0.3.1"
description = "MCP server that lets a coding agent speak out loud, offline, with Kyutai Pocket TTS."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "pocket-tts>=4.0,<5",
]

[project.scripts]
speak-mcp = "speak_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speak_mcp"]
